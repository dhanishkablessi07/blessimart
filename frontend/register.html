<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BlessiMart - Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a> |
    <a href="login.html">Login</a> |
    <span id="userInfo"></span>
    <a id="logoutLink" href="#" style="display:none">Logout</a>
  </nav>
  <h1>Register</h1>
  <form id="registerForm">
    <label>Name: <input type="text" id="name" required></label><br><br>
    <label>Email: <input type="email" id="email" required></label><br><br>
    <label>Password (min 4 chars): <input type="password" id="password" required></label><br><br>
    <label>Role:
      <select id="role">
        <option value="buyer">Buyer</option>
        <option value="seller">Seller</option>
      </select>
    </label><br><br>
    <button type="submit">Register</button>
  </form>
  <p id="msg"></p>
  <p>Have an account? <a href="login.html">Login here</a></p>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
